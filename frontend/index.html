<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#4aa3ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Billy, the Crazy Dog</title>
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="960" height="540"></canvas>
      <button type="button" id="btn-music" aria-label="Desligar música" aria-pressed="false">
        <span class="icon" aria-hidden="true">♪</span>
        <span class="label">Música</span>
      </button>
      <div id="touch" hidden>
        <div class="dpad">
          <button type="button" id="btn-left" aria-label="Esquerda">◀</button>
          <button type="button" id="btn-right" aria-label="Direita">▶</button>
        </div>
        <button type="button" id="btn-jump" aria-label="Pular">PULAR</button>
      </div>
    </div>
    <script src="js/version.js"></script>
    <script src="js/config.js"></script>
    <script src="js/display.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/draw.js"></script>
    <script src="js/player.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/levels/house.js"></script>
    <script src="js/campaign.js"></script>
    <script src="js/results.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
